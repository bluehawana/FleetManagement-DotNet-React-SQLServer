apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-backend-ingress
  namespace: fleet-app
  labels:
    app: fleet-backend
  annotations:
    # NGINX Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"

    # Body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # CORS (if needed for frontend)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://fleet.yourdomain.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # TLS certificate (cert-manager)
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
spec:
  tls:
  - hosts:
    - api.fleet.yourdomain.com
    secretName: fleet-backend-tls

  rules:
  - host: api.fleet.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fleet-backend
            port:
              number: 5000

      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: fleet-backend
            port:
              number: 5000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: fleet-monitoring
  labels:
    app: grafana
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # OAuth2 authentication (optional - for production security)
    # nginx.ingress.kubernetes.io/auth-url: "https://oauth2.yourdomain.com/oauth2/auth"
    # nginx.ingress.kubernetes.io/auth-signin: "https://oauth2.yourdomain.com/oauth2/start?rd=$escaped_request_uri"
spec:
  tls:
  - hosts:
    - grafana.fleet.yourdomain.com
    secretName: grafana-tls

  rules:
  - host: grafana.fleet.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: fleet-monitoring
  labels:
    app: prometheus
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Basic auth for Prometheus (create secret: htpasswd -c auth prometheus)
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Prometheus Authentication Required"
spec:
  tls:
  - hosts:
    - prometheus.fleet.yourdomain.com
    secretName: prometheus-tls

  rules:
  - host: prometheus.fleet.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090

---
# cert-manager ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: devops@yourdomain.com  # Change this!
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: devops@yourdomain.com  # Change this!
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Basic auth secret for Prometheus (example - generate properly in production)
# Generate with: htpasswd -c auth prometheus
# kubectl create secret generic prometheus-basic-auth --from-file=auth -n fleet-monitoring
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-basic-auth
  namespace: fleet-monitoring
type: Opaque
stringData:
  auth: |
    # Username: prometheus
    # Password: prometheus123 (CHANGE IN PRODUCTION!)
    prometheus:$apr1$vR7XqKZg$Z8YfKqPPqYGPzqVQKJhNj0
