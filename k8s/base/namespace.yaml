apiVersion: v1
kind: Namespace
metadata:
  name: fleet-data
  labels:
    name: fleet-data
    environment: production
    team: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: fleet-monitoring
  labels:
    name: fleet-monitoring
    environment: production
    team: observability
