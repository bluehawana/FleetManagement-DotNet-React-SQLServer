---
# Network Policy: fleet-app namespace
# Allow backend to communicate with PostgreSQL and receive ingress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleet-backend-policy
  namespace: fleet-app
spec:
  podSelector:
    matchLabels:
      app: fleet-backend
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from Ingress Controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 5000

    # Allow from Prometheus (for metrics scraping)
    - from:
      - namespaceSelector:
          matchLabels:
            name: fleet-monitoring
        podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 5000

    # Allow from same namespace (for pod-to-pod communication)
    - from:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 5000

  egress:
    # Allow DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53

    # Allow to PostgreSQL in fleet-data namespace
    - to:
      - namespaceSelector:
          matchLabels:
            name: fleet-data
        podSelector:
          matchLabels:
            app: postgres
      ports:
      - protocol: TCP
        port: 5432

    # Allow external HTTPS (for external APIs if needed)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443
      - protocol: TCP
        port: 80

---
# Network Policy: fleet-data namespace
# PostgreSQL should only accept connections from fleet-app backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: fleet-data
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from fleet-backend
    - from:
      - namespaceSelector:
          matchLabels:
            name: fleet-app
        podSelector:
          matchLabels:
            app: fleet-backend
      ports:
      - protocol: TCP
        port: 5432

    # Allow from Prometheus (for postgres-exporter metrics)
    - from:
      - namespaceSelector:
          matchLabels:
            name: fleet-monitoring
        podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9187

    # Allow from same namespace (StatefulSet replica communication)
    - from:
      - podSelector:
          matchLabels:
            app: postgres
      ports:
      - protocol: TCP
        port: 5432

  egress:
    # Allow DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53

    # Allow to same namespace (for replication if HA setup)
    - to:
      - podSelector:
          matchLabels:
            app: postgres
      ports:
      - protocol: TCP
        port: 5432

---
# Network Policy: fleet-monitoring namespace
# Prometheus and Grafana policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  namespace: fleet-monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from Grafana
    - from:
      - podSelector:
          matchLabels:
            app: grafana
      ports:
      - protocol: TCP
        port: 9090

    # Allow from Ingress Controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 9090

  egress:
    # Allow DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53

    # Allow to fleet-app (scrape backend metrics)
    - to:
      - namespaceSelector:
          matchLabels:
            name: fleet-app
      ports:
      - protocol: TCP
        port: 5000

    # Allow to fleet-data (scrape postgres metrics)
    - to:
      - namespaceSelector:
          matchLabels:
            name: fleet-data
      ports:
      - protocol: TCP
        port: 9187

    # Allow to Kubernetes API (for service discovery)
    - to:
      - namespaceSelector:
          matchLabels:
            name: default
      ports:
      - protocol: TCP
        port: 443

    # Allow to kube-system for metrics
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
      ports:
      - protocol: TCP
        port: 10250
      - protocol: TCP
        port: 10255

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  namespace: fleet-monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow from Ingress Controller
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: 3000

  egress:
    # Allow DNS
    - to:
      - namespaceSelector:
          matchLabels:
            name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53

    # Allow to Prometheus
    - to:
      - podSelector:
          matchLabels:
            app: prometheus
      ports:
      - protocol: TCP
        port: 9090

    # Allow external HTTPS (for Grafana plugin downloads)
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443

---
# Default Deny All Policy for fleet-app
# This ensures only explicitly allowed traffic is permitted
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fleet-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Default Deny All Policy for fleet-data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fleet-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# Default Deny All Policy for fleet-monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: fleet-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
