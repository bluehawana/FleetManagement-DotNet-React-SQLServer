name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/fleet-backend
  DOTNET_VERSION: '9.0.x'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Build and Test
  # ═══════════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For GitVersion

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore backend/FleetManagement.sln

      - name: 🔨 Build
        run: dotnet build backend/FleetManagement.sln --configuration Release --no-restore

      - name: 🧪 Run unit tests
        run: |
          dotnet test backend/FleetManagement.Tests \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      - name: 📊 Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/test-results.trx'
          check_name: 'Test Results'

      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: '**/coverage.cobertura.xml'
          flags: backend
          name: backend-coverage

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Security Scanning
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🛡️ Check for vulnerable packages
        run: |
          cd backend
          echo "Checking for vulnerable packages..."
          dotnet list FleetManagement.API/FleetManagement.API.csproj package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt

          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "⚠️ Vulnerable packages found!"
            cat vulnerable.txt
            exit 1
          else
            echo "✅ No vulnerable packages found"
          fi

      - name: 🗑️ Check for deprecated packages
        run: |
          cd backend
          dotnet list FleetManagement.API/FleetManagement.API.csproj package --deprecated

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Build and Push Docker Image
  # ═══════════════════════════════════════════════════════════════
  build-and-push-image:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: 🔍 Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: 📤 Upload image scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  # ═══════════════════════════════════════════════════════════════
  # JOB 4: Deploy to Development (Kubernetes)
  # ═══════════════════════════════════════════════════════════════
  deploy-dev:
    name: 🚀 Deploy to Development
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev-fleet.yourdomain.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          kubectl config use-context dev-cluster

      - name: 🎯 Update deployment image
        run: |
          kubectl set image deployment/fleet-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n fleet-dev

      - name: ⏳ Wait for rollout
        run: |
          kubectl rollout status deployment/fleet-backend -n fleet-dev --timeout=5m

      - name: 🏥 Health check
        run: |
          # Wait for all replicas to be ready
          kubectl wait --for=condition=ready pod \
            -l app=fleet-backend \
            -n fleet-dev \
            --timeout=5m

          # Get pod status
          kubectl get pods -n fleet-dev -l app=fleet-backend

      - name: 🧪 Run smoke tests
        run: |
          # Get backend service endpoint
          BACKEND_URL=$(kubectl get svc fleet-backend -n fleet-dev -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Testing backend at: $BACKEND_URL"

          # Test metrics endpoint
          curl -f -s http://$BACKEND_URL:5000/metrics | head -20 || exit 1

          # Test API health
          curl -f -s http://$BACKEND_URL:5000/swagger/index.html || exit 1

          echo "✅ Smoke tests passed!"

      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed, rolling back..."
          kubectl rollout undo deployment/fleet-backend -n fleet-dev
          kubectl rollout status deployment/fleet-backend -n fleet-dev

  # ═══════════════════════════════════════════════════════════════
  # JOB 5: Deploy to Production (Kubernetes)
  # ═══════════════════════════════════════════════════════════════
  deploy-prod:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://fleet.yourdomain.com

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          kubectl config use-context prod-cluster

      - name: 🎯 Update deployment image
        run: |
          kubectl set image deployment/fleet-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n fleet-prod

      - name: ⏳ Wait for rollout (canary)
        run: |
          # Gradual rollout - one pod at a time
          kubectl rollout status deployment/fleet-backend -n fleet-prod --timeout=10m

      - name: 🏥 Health check
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=fleet-backend \
            -n fleet-prod \
            --timeout=5m

          kubectl get pods -n fleet-prod -l app=fleet-backend

      - name: 🧪 Run smoke tests
        run: |
          BACKEND_URL=$(kubectl get svc fleet-backend -n fleet-prod -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

          echo "Testing production backend at: $BACKEND_URL"

          # Test metrics
          curl -f -s http://$BACKEND_URL:5000/metrics | grep "driver_fatigue_level" || exit 1

          # Test API
          curl -f -s http://$BACKEND_URL:5000/swagger/index.html || exit 1

          echo "✅ Production smoke tests passed!"

      - name: 🔄 Rollback on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed, rolling back..."
          kubectl rollout undo deployment/fleet-backend -n fleet-prod
          kubectl rollout status deployment/fleet-backend -n fleet-prod

          # Notify team
          echo "::error::Production deployment failed and was rolled back"

      - name: 📊 Update deployment metrics
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deployed at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

  # ═══════════════════════════════════════════════════════════════
  # JOB 6: Notify Results
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always()

    steps:
      - name: 📱 Send Slack notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Backend CI/CD Pipeline ${{ job.status }}

            🔗 Repository: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Author: ${{ github.actor }}
            📝 Commit: ${{ github.event.head_commit.message }}
            🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: 📧 Send email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '❌ Fleet Management Backend Deployment Failed'
          body: |
            The backend deployment pipeline has failed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}

            Please check the workflow run for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: devops-team@yourdomain.com
          from: GitHub Actions <noreply@github.com>
