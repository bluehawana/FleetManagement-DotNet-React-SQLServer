# Default values for fleet-management Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  environment: production
  domain: yourdomain.com

# Backend API configuration
backend:
  enabled: true
  name: fleet-backend
  replicaCount: 3

  image:
    repository: ghcr.io/yourusername/fleet-backend
    pullPolicy: Always
    tag: "latest"

  imagePullSecrets: []

  serviceAccount:
    create: true
    annotations: {}
    name: fleet-backend-sa

  service:
    type: LoadBalancer
    port: 5000
    metricsPort: 9090
    sessionAffinity: ClientIP

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/limit-rps: "100"
    hosts:
      - host: api.fleet.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: fleet-backend-tls
        hosts:
          - api.fleet.yourdomain.com

  env:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: "http://+:5000"

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /metrics
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /metrics
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /metrics
      port: 5000
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}

# PostgreSQL database configuration
postgresql:
  enabled: true
  name: postgres

  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: FleetManagement
    username: fleetuser
    password: FleetPass123!  # CHANGE IN PRODUCTION!
    # existingSecret: postgres-secret  # Use existing secret in production

  replicas: 1  # For HA, use 3 with Patroni/Stolon

  service:
    type: ClusterIP
    port: 5432
    # LoadBalancer for external access (optional)
    loadBalancer:
      enabled: true

  exporter:
    enabled: true
    image:
      repository: prometheuscommunity/postgres-exporter
      tag: latest
    port: 9187
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

  persistence:
    enabled: true
    size: 20Gi
    # storageClass: fast-ssd  # Uncomment for production

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  config:
    maxConnections: 100
    sharedBuffers: "256MB"
    effectiveCacheSize: "1GB"
    maintenanceWorkMem: "64MB"
    walBuffers: "16MB"

  securityContext:
    fsGroup: 999
    runAsUser: 999

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Prometheus monitoring configuration
prometheus:
  enabled: true
  name: prometheus

  image:
    repository: prom/prometheus
    tag: v2.48.0
    pullPolicy: IfNotPresent

  serviceAccount:
    create: true
    name: prometheus-sa

  service:
    type: ClusterIP
    port: 9090

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/auth-type: basic
      nginx.ingress.kubernetes.io/auth-secret: prometheus-basic-auth
    hosts:
      - host: prometheus.fleet.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: prometheus-tls
        hosts:
          - prometheus.fleet.yourdomain.com

  persistence:
    enabled: true
    size: 50Gi

  retention:
    time: 30d
    size: 50GB

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  scrapeInterval: 15s
  evaluationInterval: 15s

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Grafana visualization configuration
grafana:
  enabled: true
  name: grafana

  image:
    repository: grafana/grafana
    tag: "10.2.2"
    pullPolicy: IfNotPresent

  auth:
    adminUser: admin
    adminPassword: fleetadmin  # CHANGE IN PRODUCTION!
    # existingSecret: grafana-secret  # Use existing secret in production

  service:
    type: LoadBalancer
    port: 3000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: grafana.fleet.yourdomain.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.fleet.yourdomain.com

  persistence:
    enabled: true
    size: 10Gi

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  plugins:
    - grafana-piechart-panel
    - grafana-clock-panel

  env:
    GF_ANALYTICS_REPORTING_ENABLED: "false"
    GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

  securityContext:
    fsGroup: 472
    runAsUser: 472
    runAsNonRoot: true

  nodeSelector: {}
  tolerations: []
  affinity: {}

# Network policies configuration
networkPolicies:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# cert-manager configuration
certManager:
  enabled: true
  email: devops@yourdomain.com
  issuer:
    production:
      name: letsencrypt-prod
      server: https://acme-v02.api.letsencrypt.org/directory
    staging:
      name: letsencrypt-staging
      server: https://acme-staging-v02.api.letsencrypt.org/directory

# Namespaces
namespaces:
  app: fleet-app
  data: fleet-data
  monitoring: fleet-monitoring

# RBAC settings
rbac:
  create: true
